services:
  db:
    image: postgres:18-alpine
    shm_size: 1gb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-finance_psu_dev}
      POSTGRES_USER: ${DB_USER:-finance_psu_dev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finance_psu_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - psu_dev_db_data:/var/lib/postgresql
    networks:
      default:
        aliases:
          - psu_data_engine_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finance_psu_dev_user} -d ${DB_NAME:-finance_psu_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  psu_dev_db_data:

networks:
  default:
    name: finance_psu_dev_network
