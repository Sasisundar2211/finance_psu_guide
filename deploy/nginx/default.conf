# Origin reverse proxy for the `proxy` Compose service (DEPLOYMENT.md §2, DECISIONS.md D5).
#
# Cloudflare (Full/Strict) connects to this origin over HTTPS with a Cloudflare
# Origin CA certificate. The certificate and key are provisioned on the host
# (never committed) and bind-mounted read-only by docker-compose.prod.yml:
#   /opt/financepsu/secrets/cloudflare-origin.pem -> /etc/nginx/certs/origin.pem
#   /opt/financepsu/secrets/cloudflare-origin.key -> /etc/nginx/certs/origin.key
#
# Nginx does no application response caching (no proxy_cache). Django owns the
# cache headers and its own HSTS/secure-cookie behaviour; nothing here adds or
# overrides them.

server_tokens off;

# Phase 6 caps admin chapter PDFs at 50 MiB (core/forms.py); 64m adds protocol
# overhead headroom without making uploads unlimited.
client_max_body_size 64m;

# Docker's embedded DNS. Used with a variable in proxy_pass below so the `web`
# address is re-resolved per request: `up --build -d` recreates `web` with a new
# IP, and a name resolved once at Nginx startup would go stale (502).
resolver 127.0.0.11 valid=10s ipv6=off;

# Plain HTTP: redirect only. HTTPS is the authoritative origin path.
server {
    listen 80;
    server_name financepsu.guide www.financepsu.guide;
    return 301 https://$host$request_uri;
}

# Any other Host over HTTP goes to the canonical host, never echoed back.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://financepsu.guide$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name financepsu.guide www.financepsu.guide;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Collected static files (`collectstatic` output, shared read-only volume).
    # Django never serves these in production.
    location /static/ {
        alias /srv/static/;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # This block only ever serves TLS, so the scheme is a constant. It
        # matches SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https").
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        # Matches Gunicorn's --timeout 120 so a long admin upload is not cut
        # off by the proxy first.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
